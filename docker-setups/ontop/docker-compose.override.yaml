version: '3'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage
  rails:
    <<: *base
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - INSTALLATION_NAME="Zendly"
      - LOGO="/brand-assets/logo.svg"
      - LOGO_DARK="/brand-assets/logo.svg"
      - LOGO_THUMBNAIL="/brand-assets/logo_thumbnail.png"
      - LOGO_FAVICON="/brand-assets/favicon.png"
      - BRAND_NAME="Zendly"
      - BRAND_URL="https://kapta.zendly.ai"
      - BRAND_LOGO="/brand-assets/logo.svg"
      - BRAND_FAVICON="/brand-assets/favicon.png"
    volumes:
      - ../../public/brand-assets:/app/brand-assets
      - ../../public/brand-assets:/app/app/brand-assets
      - ../../public/brand-assets:/app/public/brand-assets
    entrypoint: docker/entrypoints/rails.sh
    command: [ 'bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0' ]
    restart: always

  ontop-sidekiq:
    <<: *base
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: [ 'bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml' ]
    restart: always
    networks:
      - chatwoot_default
volumes:
  storage_data:
  postgres_data:
  redis_data:
